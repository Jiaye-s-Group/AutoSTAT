[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autostat"
version = "2.0.0"
description = "An open-source data-analysis copilot for loading, preprocessing, visualization, modeling, and report generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Jiaye-s-Group" }
]
dependencies = [
  "openai>=1.0.0,<3.0.0",
  "python-dotenv>=1.0.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  "xgboost>=3.0.4",
  "lightgbm>=4.5.0",
  "plotly>=6.1.1",
  "statsmodels>=0.14.0",
  "kaleido>=1.0.0",
  "Pillow>=9.0.0",
  "streamlit>=1.30.0",
  "streamlit-antd-components>=0.3.2",
  "streamlit-ace>=0.1.1",
  "stqdm>=0.0.5",
  "chardet>=5.0.0,<6.0.0",
  "openpyxl>=3.1.0",
  "requests>=2.28.0",
  "python-docx>=1.0.0",
  "beautifulsoup4>=4.12.0",
  "tqdm>=4.60.0",
  "jieba>=0.42.1",
  "PyMuPDF>=1.23.0",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[tool.setuptools]
packages = ["core", "workflows"]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "output",
  "outputs",
  "results",
  "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
]
