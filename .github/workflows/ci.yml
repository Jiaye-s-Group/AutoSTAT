name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pip check
      - run: PYTHONPATH=. pytest -q tests

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag autostat:ci .
      - name: Record Docker image size
        run: |
          size=$(docker image inspect autostat:ci --format='{{.Size}}')
          echo "Docker image size: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"
